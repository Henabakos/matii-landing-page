
# MATII TECHNOLOGIES - Coolify Deployment
# Next.js + PostgreSQL 18 + Cloudinary

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://staging.matiitechnologies.com}
    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
    SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}

x-database-env: &database-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-matii}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-matii}?schema=public
  DIRECT_URL: postgresql://${POSTGRES_USER:-matii}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-matii}?schema=public

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-matii}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - matii-internal

  migrate:
    build:
      <<: *build
      target: migrator
    restart: "no"
    environment:
      <<: *database-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - matii-internal

  web:
    build:
      <<: *build
      target: runner
    restart: unless-stopped
    environment:
      <<: *database-env
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - next_cache:/app/.next/cache
    networks:
      - matii-internal

volumes:
  pgdata:
  next_cache:

networks:
  matii-internal:
    driver: bridge
