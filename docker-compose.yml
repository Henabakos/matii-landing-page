# Run with: docker compose --env-file .env.production up -d --build
# See docs/DOCKER-DEPLOYMENT.md. On the VPS, scripts/deploy.sh pulls prebuilt
# images (IMAGE_REPOSITORY/IMAGE_TAG) from GitHub Actions instead of building.

x-build: &build
  context: .
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://matiitechnologies.com}
    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
    SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}

# The app always talks to the bundled database, overriding any URL in the env file.
x-database-env: &database-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-matii}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/${POSTGRES_DB:-matii}?schema=public
  DIRECT_URL: postgresql://${POSTGRES_USER:-matii}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-matii}?schema=public

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-matii}
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the internet; the app reaches it on the internal network.

  migrate:
    build:
      <<: *build
      target: migrator
    image: ${IMAGE_REPOSITORY:-matii-site}-migrate:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      <<: *build
      target: runner
    image: ${IMAGE_REPOSITORY:-matii-site}:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment: *database-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Only reachable through Caddy; bound to loopback for direct checks on the VPS.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - next_cache:/app/.next/cache

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  next_cache:
  caddy_data:
  caddy_config:
