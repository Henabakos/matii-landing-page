# Every push to main: test, build the Docker images, push them to GHCR and
# deploy them to the VPS. Setup: docs/CI-CD.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy pushes one at a time, in order; never cancel a deploy halfway through.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: find src \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | xargs -0 pnpm exec tsx --test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      # Registry paths must be lowercase.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Baked into the image; see the Dockerfile. Override with repository variables.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://matiitechnologies.com' }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            SEO_INDEXING_ENABLED=${{ vars.SEO_INDEXING_ENABLED || 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-migrate:${{ github.sha }}
            ${{ steps.image.outputs.name }}-migrate:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://matiitechnologies.com' }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            SEO_INDEXING_ENABLED=${{ vars.SEO_INDEXING_ENABLED || 'true' }}
          cache-from: type=gha

  deploy:
    needs: build
    # Skipped until the VPS is configured (repository variable VPS_HOST).
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'matiitechnologies.com' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/matii' }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ vars.VPS_HOST }}
            User ${{ vars.VPS_USER || 'deploy' }}
            Port ${{ vars.VPS_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
      - name: Upload Compose files
        run: |
          # shellcheck disable=SC2029 # APP_DIR is meant to expand on the runner.
          tar czf - docker-compose.yml Caddyfile .env.production.example scripts/deploy.sh scripts/docker-import-database.sh \
            | ssh vps "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'"
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token expires with this job, so log out again afterwards.
          trap 'ssh vps "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT
          # shellcheck disable=SC2029 # Values are meant to expand on the runner.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          # shellcheck disable=SC2029
          ssh vps "cd '$APP_DIR' && IMAGE_REPOSITORY='$IMAGE' sh scripts/deploy.sh '${{ github.sha }}'"
      - name: Smoke test
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null "https://${{ vars.DOMAIN || 'matiitechnologies.com' }}/robots.txt" && exit 0
            sleep 5
          done
          echo "Site did not respond after deploy" >&2
          exit 1
